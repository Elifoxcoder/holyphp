<!DOCTYPE html>
<!-- ws_chat.html — browser side of the HolyPHP WebSocket chat demo.
     Open in Chrome; the server must be running (examples/ws_chat.hphp). -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HolyPHP WebSocket Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1f24;
      color: #e8e6e3;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.2rem;
    }

    #status {
      font-size: .85rem;
      color: #9a9691;
    }

    #log {
      background: #26272c;
      border: 1px solid #3a3b40;
      border-radius: 8px;
      height: 320px;
      overflow-y: auto;
      padding: .75rem;
      margin: 1rem 0;
    }

    #log div {
      padding: 2px 0;
    }

    #log .me {
      color: #7cc7ff;
    }

    form {
      display: flex;
      gap: .5rem;
    }

    input {
      flex: 1;
      padding: .5rem .75rem;
      border-radius: 6px;
      border: 1px solid #3a3b40;
      background: #26272c;
      color: inherit;
    }

    button {
      padding: .5rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }
  </style>
</head>

<body>
  <h1>HolyPHP WebSocket Chat</h1>
  <div id="status">connecting&hellip;</div>
  <div id="log"></div>
  <form id="f">
    <input id="msg" autocomplete="off" placeholder="type a message and press Enter">
    <button id="send" disabled>send</button>
  </form>
  <script>
    "use strict";
    const log = document.getElementById("log");
    const status = document.getElementById("status");
    const input = document.getElementById("msg");
    const send = document.getElementById("send");
    let ws = null;

    function add(text, cls) {
      const d = document.createElement("div");
      if (cls) d.className = cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    function connect() {
      ws = new WebSocket("ws://127.0.0.1:9500/");
      ws.onopen = () => { status.textContent = "connected to ws://127.0.0.1:9500"; send.disabled = false; };
      ws.onclose = () => {
        status.textContent = "disconnected — retrying in 1s"; send.disabled = true;
        setTimeout(connect, 1000);
      };
      ws.onerror = () => { status.textContent = "error — is wschat.exe running?"; };
      ws.onmessage = (ev) => add(ev.data);
    }

    document.getElementById("f").onsubmit = (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t || !ws || ws.readyState !== 1) return;
      ws.send(t);
      add("you: " + t, "me");
      input.value = "";
    };

    connect();
  </script>
</body>

</html>
