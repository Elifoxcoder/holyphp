# Included from nginx's http {} context (for example /etc/nginx/conf.d/).
# Expensive synchronous compile/check requests, limited per connecting IP.
limit_req_zone $binary_remote_addr zone=hphp_api:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=hphp_api_connections:10m;

# Apply the stricter start limit only to session creation; live input and SSE
# reconnects use the more generous shared live-request budget.
map $request_uri $hphp_live_start_key {
    default "";
    ~^/api/live/start(?:\?.*)?$ $binary_remote_addr;
}
limit_req_zone $hphp_live_start_key zone=hphp_live_start:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=hphp_live_requests:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=hphp_live_connections:10m;
